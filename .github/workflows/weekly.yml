name: weekly

# Weekly concierge: HARVEST -> FIND -> SKEPTIC -> anti-repeat -> CONCIERGE -> email.
# Always sends Friday morning (weekly ritual; evergreen fallback guarantees content).

on:
  schedule:
    - cron: "0 6 * * 5"     # 06:00 UTC every Friday, regardless of Sofia's local time/DST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-concierge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Worst case is ~24 min of LLM if every stage exhausts a three-model chain
    # (7 logical calls x 3 models x 69s), which LLM_TOTAL_BUDGET_SECONDS caps at 20,
    # leaving >= 15 min here for harvest. 15 total was not enough to survive one dip.
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      LLM_PROVIDER:      ${{ vars.LLM_PROVIDER }}
      # Every llm_chain.py knob, passed through whether or not the repo variable exists:
      # an unset variable expands to "", which llm_chain resolves to its own default. All
      # ten are listed now so any of them can be set from the Actions UI later with no
      # code change -- and because a knob missing from this block fails SILENTLY, with the
      # operator's configuration simply having no effect on the run.
      LLM_MODEL_CHAIN:          ${{ vars.LLM_MODEL_CHAIN }}
      LLM_SEARCH_MODEL_CHAIN:   ${{ vars.LLM_SEARCH_MODEL_CHAIN }}
      LLM_ATTEMPTS_PER_MODEL:   ${{ vars.LLM_ATTEMPTS_PER_MODEL }}
      LLM_BACKOFF_SECONDS:      ${{ vars.LLM_BACKOFF_SECONDS }}
      LLM_TIMEOUT_SECONDS:      ${{ vars.LLM_TIMEOUT_SECONDS }}
      LLM_RETRY_STATUSES:       ${{ vars.LLM_RETRY_STATUSES }}
      LLM_ADVANCE_STATUSES:     ${{ vars.LLM_ADVANCE_STATUSES }}
      LLM_TOTAL_BUDGET_SECONDS: ${{ vars.LLM_TOTAL_BUDGET_SECONDS }}
      LLM_RETRY_AFTER_CAP:      ${{ vars.LLM_RETRY_AFTER_CAP }}
      LLM_ANTHROPIC_MODEL:      ${{ vars.LLM_ANTHROPIC_MODEL }}
      SMTP_HOST:         ${{ secrets.SMTP_HOST }}
      SMTP_PORT:         ${{ secrets.SMTP_PORT }}
      SMTP_USER:         ${{ secrets.SMTP_USER }}
      SMTP_PASS:         ${{ secrets.SMTP_PASS }}
      EMAIL_TO:          ${{ secrets.EMAIL_TO }}
      EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Run weekend_concierge.py (harvest + three-stage LLM gate)
        run: python weekend_concierge.py

      - name: Persist state
        run: |
          git config user.name "weekly-concierge"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git commit -m "update state [skip ci]" || echo "no changes"
          git pull --rebase origin main || echo "nothing to rebase"
          git push
