name: harvest-smoke-test

# TEMPORARY — verifies new scrapers.py sources actually work from GitHub Actions'
# network (some sites 403/block datacenter IPs while fetching fine locally). Delete
# this file before merging; it exists only to eyeball per-source counts in the log.

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python scrapers.py
